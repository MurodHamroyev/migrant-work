{% load ui %}<details class="lang"><summary>{% icon 'globe' %}<span>{{ lang|upper }}</span></summary>
<form method="post" action="{% url 'set_lang' %}" class="menu">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
{% for code, name in LANGS %}<button name="lang" value="{{ code }}" class="{% if code == lang %}on{% endif %}">{{ name }}</button>{% endfor %}</form></details>
